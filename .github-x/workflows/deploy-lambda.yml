name: Deploy Python Lambda

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: serverless-licita

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          mkdir -p package
          pip install -r requirements.txt -t package/

      - name: Package Lambda
        run: |
          cp lambda_function.py package/
          cd package
          zip -r ../function.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload package to S3
        env:
          LAMBDA_DEPLOY_BUCKET: ${{ secrets.LAMBDA_DEPLOY_BUCKET }}
        run: |
          KEY="deployments/${GITHUB_SHA}/function.zip"

          aws s3 cp function.zip \
            "s3://${LAMBDA_DEPLOY_BUCKET}/${KEY}"

      - name: Deploy Lambda code
        env:
          LAMBDA_DEPLOY_BUCKET: ${{ secrets.LAMBDA_DEPLOY_BUCKET }}
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          KEY="deployments/${GITHUB_SHA}/function.zip"

          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$LAMBDA_DEPLOY_BUCKET" \
            --s3-key "$KEY"

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}"

      - name: Configure Lambda environment variables
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PNCP_API_URL: ${{ secrets.PNCP_API_URL }}
          REQUEST_TIMEOUT_SECONDS: ${{ secrets.REQUEST_TIMEOUT_SECONDS }}
          PNCP_COOKIE: ${{ secrets.PNCP_COOKIE }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
          MONGO_COLLECTION_LICITACOES: ${{ secrets.MONGO_COLLECTION_LICITACOES }}
          ASYNC_LICITATION_SUMMARY_ENABLED: ${{ secrets.ASYNC_LICITATION_SUMMARY_ENABLED }}
          SERVERLESS_LICITATION_SUMMARY_URL: ${{ secrets.SERVERLESS_LICITATION_SUMMARY_URL }}
        run: |
          python - <<'PY'
          import json
          import os

          keys = [
              "OPENROUTER_API_KEY",
              "PNCP_API_URL",
              "REQUEST_TIMEOUT_SECONDS",
              "PNCP_COOKIE",
              "MONGO_URI",
              "MONGO_DATABASE",
              "MONGO_COLLECTION_LICITACOES",
              "ASYNC_LICITATION_SUMMARY_ENABLED",
              "SERVERLESS_LICITATION_SUMMARY_URL",
          ]

          variables = {
              key: os.environ[key]
              for key in keys
          }

          with open("environment.json", "w") as file:
              json.dump({"Variables": variables}, file)
          PY

          aws lambda update-function-configuration \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --environment file://environment.json

          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}"

          rm -f environment.json